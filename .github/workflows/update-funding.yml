name: Update Funding Data

# Runs every hour forever, on GitHub's free scheduled-workflow minutes.
# Also runnable on demand from the Actions tab (Run workflow button) —
# use that while you're first verifying the venue endpoints, instead of
# waiting up to an hour between attempts.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write  # needed so this workflow can commit the updated data back

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Connectivity check (visible in the run log)
        run: python3 scripts/fetcher.py --test

      - name: Fetch + score + write funding_data.json
        run: python3 scripts/fetcher.py

      - name: Commit updated data back to the repo
        run: |
          git config user.name "funding-farm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add funding_data.json data/history.jsonl
          git diff --quiet --cached || git commit -m "Update funding data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
